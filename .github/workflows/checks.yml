name: Navigation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install lightweight check dependencies
        run: python -m pip install numpy==1.24.4 pandas==1.5.3
      - name: Check navigation geometry and control conditions
        run: python -m unittest discover -s tests -v
      - name: Replay saved baseline navigation
        run: python scripts/run_search_homing.py --replay examples/search-20261104
      - name: Replay saved validation controls
        run: python scripts/run_validation_suite.py --verify examples/validation-20261104
